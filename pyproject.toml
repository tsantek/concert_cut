[project]
name = "track_cut"
version = "0.1.0"
description = "Download audio from the network or disk, cut concerts into songs, or save playlist tracks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tom Santek" }]
keywords = ["audio", "track", "cut", "playlist", "export", "desktop"]
dependencies = [
  "PySide6>=6.6.0",
  "yt-dlp>=2024.1.0",
  "numpy>=1.26.0",
  "soundfile>=0.12.1",
]

[project.scripts]
track-cut = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
